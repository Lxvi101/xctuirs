[package]
name = "xctuirs"
version = "0.1.0"
edition = "2024"
description = "A Rust terminal companion for Xcode: build, test and run without opening the IDE"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/Lxvi101/xctuirs"
homepage = "https://github.com/Lxvi101/xctuirs"
readme = "README.md"
keywords = ["xcode", "xcodebuild", "ios", "tui", "simulator"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/spec/screens"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.11"
libc = "0.2"
os_pipe = "1"
ctrlc = { version = "3", features = ["termination"] }
crossterm = "0.28"
ratatui = "0.29"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"

[profile.release]
lto = true
strip = true
